<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shopicar · Vendre mon auto</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look noir et blanc épuré, une seule touche de bleu (--acc) */
:root{
  --navy:#000000; --navy2:#111111; --ink:#0a0a0a; --muted:#737373; --line:#ebebeb; --bg:#ffffff; --card:#ffffff; --soft:#f5f5f5;
  --acc:#006feb; --acc-ink:#ffffff; --acc-soft:#e6f1fd;
  --ok:#0a0a0a; --ok-soft:#f5f5f5; --warn:#0a0a0a; --warn-soft:#f5f5f5; --bad:#dc2626; --bad-soft:#fef2f2;
  --f-display:'Inter',system-ui,-apple-system,sans-serif; --f-body:'Inter',system-ui,-apple-system,sans-serif;
  --r:14px; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.006em}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.025em;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto;min-height:100%;padding-bottom:110px}
.top{background:#000;color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 20px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:block;height:22px;width:auto}
.top .back{background:transparent;border:1px solid rgba(255,255,255,.2);color:#fff;width:36px;height:36px;border-radius:99px;font-size:20px}
.pf-btn{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;width:38px;height:38px;border-radius:99px;display:flex;align-items:center;justify-content:center;position:relative}
.pf-btn.on:after{content:'';position:absolute;right:1px;bottom:1px;width:9px;height:9px;border-radius:99px;background:var(--acc);border:2px solid #000}
.pill-top{font-size:12px;color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.2);padding:5px 10px;border-radius:99px}
.wrap{padding:20px;display:flex;flex-direction:column;gap:14px}
.hero{background:#000;color:#fff;padding:12px 20px 32px;display:flex;flex-direction:column;gap:14px}
.steps3{display:flex;flex-direction:column;gap:22px;padding:8px 4px}
.s3{display:flex;gap:16px;align-items:center}
.s3>span{flex:0 0 32px;height:32px;border-radius:50%;border:1.5px solid #000;display:grid;place-items:center;font-weight:600;font-size:14px}
.s3 b{display:block;font-size:16px}.s3 small{display:block;color:#737373;font-size:14px;margin-top:2px}
.hero h1{font-size:36px;line-height:1.08;font-weight:700;letter-spacing:-.035em}
.hero p{margin:0;color:#a3a3a3}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:17px}
.card h3{font-size:15px}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:600;font-size:15px;transition:opacity .15s,background .15s;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.pri{background:var(--acc);color:var(--acc-ink)}
.btn.pri:disabled{background:#d4d4d4;color:#fff}
.btn:active{opacity:.85}
.btn.sec{background:var(--card);border:1px solid #e5e5e5;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--acc);padding:10px}
a.btn,a.btn:visited{text-decoration:none}
.btn.dark{background:#fff;color:var(--navy)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:500;font-size:13.5px}
.inp{border:1px solid #e5e5e5;border-radius:12px;padding:14px;background:#fff;width:100%;font-size:16px}
.best .inp{color:var(--ink,#0a0a0a);-webkit-text-fill-color:var(--ink,#0a0a0a);caret-color:var(--acc)}.best .inp::placeholder{color:#a3a3a3;-webkit-text-fill-color:#a3a3a3}
.inp:focus{border-color:var(--acc);outline:none}
.vin-inp{font-family:ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;font-size:18px;text-align:center}
.vin-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.stp{gap:16px}.stp.ok{border-color:#cfe3fb}
.stp-h{display:flex;gap:12px;align-items:flex-start}
.stp-n{flex:0 0 32px;height:32px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.stp-n.ok{background:var(--acc)}
.stp-s{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:#f2f2f2;color:#737373;white-space:nowrap}
.stp-s.ok{background:var(--acc-soft);color:var(--acc)}
.stp-q{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid #f0f0f0}
.stp-prog{height:6px;border-radius:9px;background:#ebebeb;overflow:hidden;margin-top:10px}.stp-prog i{display:block;height:100%;background:var(--acc);transition:width .4s}
.doc{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #ececec;border-radius:14px}
.doc.ok{background:#f7fbff;border-color:#cfe3fb}
.doc-i{flex:0 0 36px;height:36px;border-radius:10px;background:#f2f2f2;display:grid;place-items:center;font-size:17px}
.doc.ok .doc-i{background:var(--acc);color:#fff;font-weight:700;font-size:15px}
.doc b{font-size:14.5px;display:block}
.doc-b.blk{background:#000;color:#fff;border:1px solid #000}
.doc-b{flex:0 0 auto;width:auto!important;padding:10px 14px!important;font-size:14px!important}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid #e5e5e5;background:#fff;border-radius:12px;padding:8px 0}
.day small{font-size:11px;color:#737373}.day b{font-size:18px}
.day.on{background:#000;border-color:#000;color:#fff}.day.on small{color:#d4d4d4}
.pay{display:flex;flex-direction:column;gap:10px}.pay>div{display:flex;gap:12px;align-items:center;font-size:14.5px}
.pay>div b{flex:0 0 24px;height:24px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-size:12px}
.dmgcard{border:2px solid var(--acc);background:#f5f9ff;gap:14px;box-shadow:0 8px 24px rgba(0,111,235,.15)}
.jrow{display:flex;gap:12px;align-items:flex-start}.jrow .julia-av{flex:0 0 38px}.jrow>div:nth-child(2){flex:1}
.bubble{background:var(--soft);border-radius:4px 16px 16px 16px;padding:10px 13px;font-size:15px}
.btn.more{background:#000;color:#fff;display:flex;align-items:center;gap:12px;text-align:left;padding:15px 16px;border-radius:14px}
.btn.more .mi{flex:0 0 34px;height:34px;border-radius:50%;background:var(--acc);display:grid;place-items:center;font-size:18px;font-weight:700}
.btn.more .mt{flex:1;display:flex;flex-direction:column;gap:2px}.btn.more .mt b{font-size:16.5px}.btn.more .mt span{font-size:13px;color:#a3a3a3;font-weight:400}
.btn.more .mc{font-size:24px;color:#a3a3a3}
.btn.more.lite{background:#fff;color:var(--ink,#0a0a0a);border:1.5px solid var(--acc)}.btn.more.lite .mi{color:#fff}.btn.more.lite .mt b{font-size:15.5px}.btn.more.lite .mt span{color:#737373}.btn.more.lite .mc{color:var(--acc)}
@keyframes pulseBtn{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}.pulse{animation:pulseBtn .45s ease 2}
.card.guard{border-color:var(--acc)}
.stepk{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-bottom:2px}
.dmg-i{width:40px!important;height:40px!important;flex-basis:40px!important;font-size:18px!important}
.dmgcard.ok{border-color:#cfe3fb;background:#fff}
.dmgcard.need{animation:dmgp .9s ease 2}@keyframes dmgp{50%{box-shadow:0 0 0 6px rgba(0,111,235,.25)}}
.dmg-h{display:flex;gap:12px;align-items:flex-start}
.dmg-i{flex:0 0 32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800}
.dmg-or{display:flex;align-items:center;gap:10px;color:#a3a3a3;font-size:13px}.dmg-or:before,.dmg-or:after{content:"";flex:1;height:1px;background:#e5e5e5}
.dmg-ok{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--acc);font-weight:600}
.lnk{background:none;border:0;color:#737373;text-decoration:underline;font-size:13px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #e5e5e5;background:#fff;border-radius:99px;padding:9px 15px;font-size:14px;font-weight:500;text-align:left}
.chip.on{border-color:#000;background:#000;color:#fff;font-weight:500}
.q{display:flex;flex-direction:column;gap:9px}
.q>.ql{font-weight:600;font-size:15px}
.q .hint{font-size:13px;color:var(--muted);margin-top:-4px}
.prog{display:flex;gap:6px}
.prog i{flex:1;height:3px;border-radius:9px;background:#ebebeb}
.prog i.on{background:var(--acc)}
.steplbl{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.08em}
.feat{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start}
.feat .ic{width:36px;height:36px;border-radius:99px;background:var(--soft);color:var(--ink);display:grid;place-items:center;font-weight:600;font-family:var(--f-display)}
.feat b{display:block}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.88);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5}
.tabs .in{max-width:520px;width:100%;display:flex}
.tab{flex:1;background:none;border:0;padding:6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:500;color:#a3a3a3}
.tab svg{width:22px;height:22px;stroke-width:1.75}
.tab.on{color:#000}
.badge{background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;margin-left:2px}
.veh{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.veh .t{font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;font-size:17px;line-height:1.2}
.thumb{width:120px;height:78px;border-radius:12px;background:var(--soft);display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:108px}
.best{background:var(--acc);color:#fff;border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.best h2{font-size:22px;line-height:1.15;letter-spacing:-.03em}
.best.ok{background:#fff;color:var(--ink);border:1px solid #e5e5e5;box-shadow:0 6px 20px rgba(0,0,0,.06)}
.best.ok p{color:#525252;margin:0}
.best.ok .btn{width:100%}
.best.official{gap:8px;padding:24px 20px;background:#000}
.best.official .tag{background:var(--acc);color:#fff;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;border-radius:99px}
.best.official h2{font-size:20px;margin-top:4px}
.best.official .amt{font-family:var(--f-display);font-weight:700;font-size:60px;line-height:1;letter-spacing:-.045em;margin-top:4px}
.best.official .amt sup{font-size:24px;margin-left:3px;font-weight:600}
.best.official .amt sup{color:var(--acc)}
.best.official .btn.pri{margin-top:6px}
.best.official .gain{background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:14px;padding:5px 11px;border-radius:99px}
.best.official .cd{font-size:13.5px;color:#a3a3a3}.best.official .cd b{color:#fff}
.best p{margin:0;color:rgba(255,255,255,.88)}
.best .btn.dark{color:var(--acc);margin-top:4px}
.btn.big{padding:17px 18px;font-size:16.5px;border-radius:14px}
.jl-pulse.sm{width:40px;height:40px}.jl-pulse.sm .julia-av{width:40px;height:40px;font-size:16px}
.best .jl-pulse:before,.best .jl-pulse:after{border-color:#fff}
.slot.need{border-color:var(--acc);border-style:solid;animation:need .6s ease 2}
@keyframes need{50%{transform:scale(1.04)}}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{aspect-ratio:4/3;border:1px dashed #d4d4d4;border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:12px;color:var(--muted);position:relative;overflow:hidden;padding:4px;text-align:center;line-height:1.2}
.slot b{font-size:20px;font-weight:300;color:var(--ink);line-height:1}
.slot:not(.on){border:1.5px dashed var(--acc);background:var(--acc-soft);color:var(--acc);font-weight:600;gap:2px}
.slot:not(.on) b{color:var(--acc);font-size:22px;font-weight:400}
.acct{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;padding:2px 2px 0}
.gcar.arch .veh,.gcar.arch .amt{opacity:.6}
.swipe{position:relative;border-radius:var(--r);overflow:hidden}
.swipe .swipe-act{position:absolute;inset:0;display:flex;justify-content:flex-end;align-items:stretch;background:#e5484d;border-radius:var(--r)}
.swipe .swipe-act.un{background:var(--acc)}
.swipe:not(.on) .swipe-act{visibility:hidden}
.swipe .swipe-act button{width:104px;border:0;background:none;color:#fff;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.swipe .gcar{position:relative;transition:transform .22s ease;touch-action:pan-y}
.swipe .gcar.drag{transition:none}
@media (hover:none){ .gcar .arch-lnk{display:none} }
.swipe-hint{text-align:center;font-size:12px;color:var(--muted);margin:-6px 0 0}
.card.focus{border:2px solid var(--acc);box-shadow:0 6px 24px rgba(0,111,235,.14)}
.offer-mini{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#000;color:#fff;border-radius:14px;padding:12px 16px}
.offer-mini span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#a3a3a3}
.offer-mini b{font-size:22px}
.slot.on{border:0;background:var(--soft)}
.slot.on img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot.on span{position:absolute;left:5px;bottom:5px;background:rgba(0,0,0,.65);color:#fff;font-size:10.5px;padding:2px 7px;border-radius:99px;max-width:calc(100% - 10px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .rm{position:absolute;top:4px;right:4px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;width:22px;height:22px;font-size:13px;line-height:1}
.thumb.mono{background:#0a0a0a;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:10px 12px;gap:1px;position:relative}
.thumb.mono .mk{font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#a3a3a3;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb.mono .md{font-family:var(--f-display);font-weight:700;letter-spacing:-.035em;line-height:1.05;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb.mono .yr{font-size:11px;color:#737373;font-variant-numeric:tabular-nums}
.thumb.mono i{position:absolute;right:10px;bottom:10px;width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14.5px}
.kv .k{color:var(--muted)}
.kv .v{font-weight:500;text-align:right;color:var(--ink)}
.kv .sep{grid-column:1/-1;border-top:1px solid var(--line)}
.kv .tot{font-weight:700;font-size:17px;color:var(--ink)}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:4px 10px;border-radius:99px;width:max-content}
.stat.ok{background:#000;color:#fff}
.stat.warn{background:var(--soft);color:#404040;border:1px solid #e5e5e5}
.stat.bad{background:var(--bad-soft);color:var(--bad)}
.stat.info{background:var(--acc-soft);color:var(--acc)}
.offer{background:#000;color:#fff;border-radius:20px;padding:24px 22px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.offer .lbl{color:#a3a3a3;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.1em}
.offer .amt{font-family:var(--f-display);font-weight:700;font-size:52px;line-height:1;letter-spacing:-.045em}
.offer .amt sup{font-size:22px;color:var(--acc);margin-left:3px;font-weight:600}
.offer .cd{display:flex;gap:8px;align-items:center;font-size:13.5px;color:#d4d4d4}
.bonus{background:#ffc53d;border-radius:14px;padding:12px 14px;color:#0a0a0a;font-size:14.5px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.bonus b{font-family:var(--f-display);font-size:18px;font-weight:600}
ul.clean{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.clean li{display:grid;grid-template-columns:16px 1fr;gap:8px;font-size:14px;color:#404040}
ul.clean li:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--acc);margin-top:9px;margin-left:3px}
ul.clean.warnl li:before{background:#000}
.tl{display:flex;flex-direction:column;gap:0}
.tl .s{display:grid;grid-template-columns:26px 1fr;gap:10px;position:relative;padding-bottom:14px}
.tl .s:not(:last-child):after{content:"";position:absolute;left:12px;top:24px;bottom:0;width:2px;background:var(--line)}
.tl .dot{width:26px;height:26px;border-radius:50%;border:1px solid #d4d4d4;background:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.tl .s.done .dot{background:#000;border-color:#000;color:#fff}
.tl .s.cur .dot{border-color:var(--acc);color:var(--acc)}
.tl .s b{font-size:14.5px;font-weight:600}
.load{display:flex;flex-direction:column;gap:14px;padding:30px 18px}
.load .jl-head{gap:0;padding:18px 0 10px}
.load .jl-head .jl-pulse{margin-bottom:34px}
.load .jl-head h2{margin:0 0 12px;line-height:1.25}
.load .jl-head .muted{line-height:1.6;max-width:330px;margin:0 0 16px!important}
.load .jl-bar{margin:6px 0 10px}
.load .ld{padding:4px 0;line-height:1.4}
.ld{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:center;font-weight:500;color:#a3a3a3}
.ld.on{color:var(--ink)}
.ld.done{color:var(--ok)}
.spin{width:20px;height:20px;border-radius:50%;border:2px solid #ebebeb;border-top-color:var(--acc);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.gcar{display:flex;flex-direction:column;gap:12px;cursor:pointer}
.gcar .bot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gcar .amt{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.03em}
.empty{text-align:center;padding:30px 18px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty svg{width:180px}
.err{background:var(--bad-soft);color:#b91c1c;border:1px solid #fecaca;border-radius:12px;padding:12px;font-size:14px}
.note{background:var(--soft);color:#404040;border:1px solid #ebebeb;border-radius:12px;padding:12px;font-size:14px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos .ph{aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--soft);position:relative}
.photos .ph img{width:100%;height:100%;object-fit:cover}

/* Parcours Julia : analyse, estimation, recherche en direct */

/* ===== iPad & desktop : la vue mobile (< 768 px) reste identique. Même navigation (barre d'onglets en bas), contenu plus large. ===== */

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="tabs"></div>
<input type="file" id="scanFile" class="file-hidden" accept="image/*" capture="environment">
<input type="file" id="photoFile" class="file-hidden" accept="image/*" multiple>
<input type="file" id="slotFile" class="file-hidden" accept="image/*">

<script>
/* ============ CONFIG ============ */
const FEE_MIN = 700, FEE_MAX = 1200;  // anciens dossiers seulement; le calcul est sur le serveur (api/_lib/pricing.js)
const FEE = FEE_MAX;         // anciens dossiers sans frais enregistré
const BONUS_24H = 200;       // bonus si acceptation < 24 h après l'offre officielle
const OFFER_HOURS = 48;      // validité de l'offre
const SHOW_BREAKDOWN = true; // afficher wholesale − frais au client
/* Offres validées qui font monter le prix en direct : elles viennent de 360inspek (réseau Shopicar, agent.shopicar.com),
   où l'équipe envoie les offres d'achat depuis la fiche du véhicule (api/lead.js → fonction « shopicar-lead »).
   Démo : ouvrir l'app avec ?demo=1 (?demo=0 pour revenir) simule des offres (+300, +400, +300, +500 $) sans rien envoyer à 360inspek. */
/* Phase privée : démo ACTIVE PAR DÉFAUT sur ai.shopicar.com (?demo=0 la coupe sur l'appareil). À RETIRER (DEMO_DEFAULT_HOSTS = []) avant d'ouvrir au public. */
const DEMO_DEFAULT_HOSTS = ['ai.shopicar.com'];
const DEMO_OFFERS = (()=>{ const def=DEMO_DEFAULT_HOSTS.includes(location.hostname); try{ const q=new URLSearchParams(location.search).get('demo'); if(q==='1') localStorage.setItem('sc_demo','1'); if(q==='0') localStorage.setItem('sc_demo','0'); const v=localStorage.getItem('sc_demo'); return v==='1' || (v===null && def); }catch(e){ return /[?&]demo=1/.test(location.search) || (def && !/[?&]demo=0/.test(location.search)); } })();
const LEAD_POLL_MS = 8000;
/* Super Admin : ouvrir l'app avec ?admin=<clé> (gardé sur l'appareil), ?admin=0 pour revenir en vue client.
   Seul le hash SHA-256 de la clé est dans le code. La clé est envoyée au serveur (x-admin-key) pour recevoir le détail interne
   (comparables, marge, wholesale, frais), qui n'est jamais envoyé au téléphone d'un client. */
const ADMIN_HASH = '764cbe90fec6987e00d7f9e28429e9530cdfa4af07e9269e3eddca939837598e';
let IS_ADMIN = false;
const adminKey = () => { try{ return IS_ADMIN ? (localStorage.getItem('sc_admin_key')||'') : ''; }catch(e){ return ''; } };
async function initAdmin(){ try{
  const q=new URLSearchParams(location.search).get('admin');
  if(q==='0'){ localStorage.removeItem('sc_admin'); localStorage.removeItem('sc_admin_key'); }
  else if(q){ const h=[...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(q)))].map(b=>b.toString(16).padStart(2,'0')).join('');
    if(h===ADMIN_HASH){ localStorage.setItem('sc_admin',h); localStorage.setItem('sc_admin_key',q); } }
  if(q!==null){ const u=new URL(location.href); u.searchParams.delete('admin'); history.replaceState(null,'',u.pathname+u.search); }
  IS_ADMIN = localStorage.getItem('sc_admin')===ADMIN_HASH;
}catch(e){ IS_ADMIN=false; } if(IS_ADMIN) rerender(); }
const DEMO_STEPS = [{t:6,add:300},{t:14,add:400},{t:22,add:300},{t:31,add:500}]; // secondes après le début de la recherche
const DEMO_DONE_T = 38;

/* ============ UTIL ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (Math.round(n)).toLocaleString('fr-CA') + ' $';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
function parseJSON(t){ t=String(t).replace(/```(json)?/g,''); const end=t.lastIndexOf('}'); if(end<0) throw new Error('JSON introuvable');
  for(let i=t.indexOf('{'); i>=0 && i<end; i=t.indexOf('{',i+1)){ try{ return JSON.parse(t.slice(i,end+1)); }catch(e){} } throw new Error('JSON invalide'); }
function timeLeft(ms){ if(ms<=0) return 'Expirée'; const h=Math.floor(ms/3600000), m=Math.floor(ms%3600000/60000); return h+' h '+String(m).padStart(2,'0')+' min'; }

/* ============ CAPACITÉS (Claude, stockage) ============ */
let _sample=null;
/* Hors de Claude (Vercel, etc.), l'AI passe par /api/ai, qui appelle l'API Anthropic côté serveur. */
const blobToB64 = b => new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(String(fr.result).split(',')[1]); fr.readAsDataURL(b); });
function apiSample(){
  const f = async (input, opts={}) => {
    const images = opts.images ? await Promise.all(opts.images.map(blobToB64)) : [];
    let res;
    try{ res = await fetch('/api/ai',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({input, images, modelTier:opts.modelTier||'default', web:!!opts.web})}); }
    catch(e){ const er=new Error('réseau'); er.code='unavailable'; throw er; }
    const j = await res.json().catch(()=>({ error:'HTTP '+res.status+' (réponse non JSON, délai dépassé ?)' }));
    if(!res.ok){ const er=new Error(j.error||'erreur'); er.code = res.status===429?'rate_limited':res.status===404?'not_granted':/ANTHROPIC_API_KEY/.test(j.error||'')?'no_key':'unavailable'; throw er; }
    return { text: j.text||'' };
  };
  f.limits = async () => ({ images:true });
  return f;
}
function getSample(){ if(!_sample) _sample = (window.claude && claude.use) ? claude.use('sample').then(s=>s||apiSample()).catch(()=>apiSample()) : Promise.resolve(apiSample()); return _sample; }
async function ask(input, opts={}){ const s=await getSample(); if(!s) { const e=new Error('IA non disponible'); e.code='not_granted'; throw e; } const r=await s(input, opts); return r.text; }

const Store = {
  mode:'memory', db:null, uid:null, mem:[], ready:null, chain:Promise.resolve(),
  init(){ if(this.ready) return this.ready;
    this.ready=(async()=>{
      try{ if(window.claude && claude.use){ const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
        if(db && user){ const id=await user.id(); if(id){ this.db=db; this.uid=id; this.mode='db'; return; } } } }catch(e){}
      this.toLocal();
    })(); return this.ready; },
  toLocal(){ try{ localStorage.setItem('sc_t','1'); localStorage.removeItem('sc_t'); this.mode='local'; }catch(e){ this.mode='memory'; } },
  col(){ return this.db.collection('leads/'+this.uid+'/cars'); },
  async list(){ await this.init();
    if(this.mode==='db'){ try{
      const snap = await Promise.race([this.col().get(), new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),10000))]);
      return snap.docs.map(d=>Object.assign({}, d.data(), {id:d.id}));
    }catch(e){ this.toLocal(); } }
    if(this.mode==='local'){ try{ return JSON.parse(localStorage.getItem('sc_cars')||'[]'); }catch(e){ return []; } }
    return this.mem.slice(); },
  async remove(id){ await this.init(); if(this.mode==='local'){ try{ const all=JSON.parse(localStorage.getItem('sc_cars')||'[]').filter(c=>c.id!==id); localStorage.setItem('sc_cars', JSON.stringify(all)); }catch(e){} } this.mem=this.mem.filter(c=>c.id!==id); },
  save(car, quiet){ if(car&&car.estimate) Cloud.key(car); const clean=JSON.parse(JSON.stringify(car)); if(!quiet) Cloud.save(car);
    this.chain = this.chain.then(async()=>{ await this.init();
      if(this.mode==='db'){ try{ await this.col().doc(clean.id).set(clean); return; }catch(e){ this.toLocal(); } }
      if(this.mode==='local'){ try{ const all=JSON.parse(localStorage.getItem('sc_cars')||'[]'); const i=all.findIndex(c=>c.id===clean.id); if(i>=0) all[i]=clean; else all.push(clean); localStorage.setItem('sc_cars', JSON.stringify(all)); return; }catch(e){ this.mode='memory'; } }
      const i=this.mem.findIndex(c=>c.id===clean.id); if(i>=0) this.mem[i]=clean; else this.mem.push(clean);
    }).catch(()=>{}); return this.chain; }
};

/* ============ BASE SHOPICAR (api/dossier → Supabase « Shopicar », fonction offer-dossier) ============
   Chaque dossier qui a une offre initiale est sauvegardé : réponses, offre initiale, offres, statut, dossier, rendez-vous,
   et les fichiers (photos, dommages, documents) dans un stockage privé. Mode démo : sauvegardé aussi, marqué demo.
   La clé du dossier (dbKey) reste sur l'appareil : seule elle peut modifier le dossier. Jamais bloquant pour le client. */
const Cloud = {
  q:{}, t:{},
  key(c){ if(!c.dbKey) c.dbKey=Array.from(crypto.getRandomValues(new Uint8Array(24)),b=>b.toString(16).padStart(2,'0')).join(''); return c.dbKey; },
  async call(body){ const r=await fetch('/api/dossier',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({error:'HTTP '+r.status})); if(!r.ok) throw new Error(j.error||('HTTP '+r.status)); return j; },
  run(c, fn){ this.q[c.id]=(this.q[c.id]||Promise.resolve()).then(fn).catch(e=>console.warn('[dossier]', e.message)); return this.q[c.id]; },
  payload(c){ const { slots, dmg, photos, photoBlobs, dbKey, dbSaved, ...rest } = c; return JSON.parse(JSON.stringify(rest)); },
  push(c){ const pv=PV.get(); const vt=pv&&pv.phone===phoneE164((c.answers||{}).cell)?pv.token:undefined;
    return this.run(c, ()=>this.call({action:'save', id:c.id, key:this.key(c), demo:!!DEMO_OFFERS, verify_token:vt, car:this.payload(c)}).then(()=>{ if(!c.dbSaved){ c.dbSaved=true; Store.save(c); } })); },
  save(c){ if(!c||!c.estimate) return; clearTimeout(this.t[c.id]); this.t[c.id]=setTimeout(()=>{ delete this.t[c.id]; this.push(c); }, 700); },
  flush(c){ if(this.t[c.id]){ clearTimeout(this.t[c.id]); delete this.t[c.id]; return this.push(c); } if(!c.dbSaved) return this.push(c); },
  vt(c){ const pv=PV.get(); return pv&&pv.phone===phoneE164((c.answers||{}).cell)?pv.token:undefined; },
  file(c, kind, slot, blob, mime, name){ if(!c||!c.estimate||!blob) return; this.flush(c);
    return this.run(c, async()=>this.call({action:'file', id:c.id, key:this.key(c), verify_token:this.vt(c), kind, slot, name:name||'', mime, data:await blobToB64(blob)})); },
  rm(c, kind, slot){ if(!c||!c.estimate) return; this.flush(c); return this.run(c, ()=>this.call({action:'file-rm', id:c.id, key:this.key(c), verify_token:this.vt(c), kind, slot:slot||''})); },
  dmgAll(c){ const B=BLOBS[c.id]; this.rm(c,'dommage'); ((B&&B.dmg)||[]).forEach((bl,i)=>this.file(c,'dommage','d'+i,bl,'image/jpeg','dommage-'+(i+1)+'.jpg')); }
};

/* ============ CONFIRMATION DU CELLULAIRE (code texto, api/verify) ============
   Juste avant l'offre initiale. Le code est texté depuis la ligne Shopicar; il ne passe jamais par le navigateur.
   Un numéro déjà confirmé sur cet appareil n'est pas redemandé. Le jeton prouve le numéro au dossier (phone_verified). */
const phoneE164 = v => { const d=String(v||'').replace(/\D/g,''); return d.length===10?'+1'+d:(d.length===11&&d[0]==='1'?'+'+d:null); };
const fmtCell = p => { const d=String(p||'').replace(/\D/g,'').slice(-10); return d.length===10?`${d.slice(0,3)} ${d.slice(3,6)}-${d.slice(6)}`:p; };
const PV = { get(){ try{ return JSON.parse(localStorage.getItem('sc_phone_ok')||'null'); }catch(e){ return null; } },
  set(v){ try{ localStorage.setItem('sc_phone_ok', JSON.stringify(v)); }catch(e){} } };
const phoneOk = cell => { const p=PV.get(); return !!(p && p.token && p.phone===phoneE164(cell)); };
const OTP_ERR = { code_invalide:'Code incorrect.', code_expire:'Ce code est expiré. Demande un nouveau code.', trop_essais:'Trop d\'essais. Demande un nouveau code.',
  trop_de_codes:'Trop de codes demandés. Réessaie dans 15 minutes.', sms:'Impossible d\'envoyer le texto. Vérifie ton numéro.', numero_invalide:'Ce numéro de cellulaire n\'est pas valide.' };
let OTP = {};
async function verifyApi(body){ const r=await fetch('/api/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}); const j=await r.json().catch(()=>({})); return {ok:r.ok, j}; }
function openOtp(){ OTP={ mode:'offer', phone:phoneE164(S.draft.answers.cell), busy:false, sending:true, err:'', info:'', code:'' }; renderOtp(); otpSend(false); }
function openLogin(){ OTP={ mode:'login', phone:null, busy:false, sending:false, err:'', info:'', code:'' }; renderOtp(); }
function renderOtp(){ const busy=OTP.busy||OTP.sending;
  if(OTP.mode==='login' && !OTP.phone){ $('#modal').innerHTML=`<div class="sheet-bg" data-act="close"><div class="sheet">
    <div class="hd"><h2>Me connecter</h2><button class="btn ghost" data-act="close" style="width:auto;padding:0 4px" aria-label="Fermer">✕</button></div>
    <div class="bd"><p style="margin:0">Entre ton cellulaire : on te texte un code pour retrouver ton garage et tes autos sur cet appareil.</p>
      <input id="loginCell" class="inp num" type="tel" inputmode="tel" autocomplete="tel" placeholder="514 555-0123" value="${esc(OTP.cellDraft||'')}">
      ${OTP.err?`<p class="small" style="margin:0;color:var(--bad)">${esc(OTP.err)}</p>`:''}
      <button class="btn pri big" data-act="login-send">Recevoir mon code</button></div></div></div>`;
    setTimeout(()=>$('#loginCell')?.focus(),60); return; }
  $('#modal').innerHTML=`<div class="sheet-bg" data-act="close"><div class="sheet">
    <div class="hd"><h2>Confirme ton cellulaire</h2><button class="btn ghost" data-act="close" style="width:auto;padding:0 4px" aria-label="Fermer">✕</button></div>
    <div class="bd">
      <p style="margin:0">${OTP.sending?'Envoi du code par texto…':`On t'a texté un code à 6 chiffres au <b class="num">${esc(fmtCell(OTP.phone))}</b>.`}</p>
      <input id="otpIn" class="inp num" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" value="${esc(OTP.code)}" style="font-size:28px;letter-spacing:.4em;text-align:center">
      ${OTP.err?`<p class="small" style="margin:0;color:var(--bad)">${esc(OTP.err)}</p>`:OTP.info?`<p class="small" style="margin:0;color:var(--ok)">${esc(OTP.info)}</p>`:''}
      <button class="btn pri big" data-act="otp-check" ${busy||OTP.code.length!==6?'disabled':''}>${OTP.busy?'<span class="spin"></span> Vérification…':OTP.mode==='login'?'Me connecter':'Confirmer et voir mon offre'}</button>
      <div class="row"><button class="btn sec" data-act="otp-resend" ${busy?'disabled':''}>Renvoyer le code</button><button class="btn sec" data-act="otp-edit">Modifier mon numéro</button></div>
      <p class="muted small" style="margin:0">On confirme ton numéro pour t'envoyer ton offre et protéger ton dossier. Aucun texto publicitaire.</p>
    </div></div></div>`;
  const inp=$('#otpIn'); if(!inp) return;
  inp.addEventListener('input',()=>{ OTP.code=inp.value.replace(/\D/g,'').slice(0,6); if(inp.value!==OTP.code) inp.value=OTP.code; OTP.err='';
    const b=$('[data-act="otp-check"]'); if(b) b.disabled=OTP.busy||OTP.sending||OTP.code.length!==6; if(OTP.code.length===6 && !OTP.busy) otpCheck(); });
  if(!OTP.sending) setTimeout(()=>inp.focus(),60); }
async function otpSend(resend){ OTP.sending=true; OTP.err=''; OTP.info=''; renderOtp();
  try{ const {ok,j}=await verifyApi({action:'send', phone:OTP.phone}); OTP.sending=false;
    if(ok){ OTP.info=resend?'Nouveau code envoyé.':''; } else OTP.err=OTP_ERR[j.error]||'Envoi impossible pour l\'instant. Réessaie.'; }
  catch(e){ OTP.sending=false; OTP.err='Envoi impossible pour l\'instant. Réessaie.'; }
  if($('#otpIn')) renderOtp(); }
async function otpCheck(){ if(OTP.busy||OTP.code.length!==6) return; OTP.busy=true; OTP.err=''; renderOtp();
  try{ const {ok,j}=await verifyApi({action:'check', phone:OTP.phone, code:OTP.code}); OTP.busy=false;
    if(ok&&j.token){ PV.set({phone:OTP.phone, token:j.token, at:Date.now()}); $('#modal').innerHTML='';
      if(OTP.mode==='login'){ toast('Connecté. Ton garage est à jour.'); go('garage'); syncGarage(true); }
      else { const a=S.draft.answers; runValuation(); syncGarage(false).then(()=>{ const pf=PROFILE.get()||{}; const up={};
          if(!pf.full_name&&a.nom) up.full_name=a.nom.trim(); if(!pf.postal&&a.postal) up.postal=String(a.postal).trim().toUpperCase();
          if(Object.keys(up).length) profileApi(up).catch(()=>{}); }); }
      return; }
    OTP.err=(OTP_ERR[j.error]||'Vérification impossible. Réessaie.')+(j.error==='code_invalide'&&j.restants!=null?` Il te reste ${j.restants} essai${j.restants>1?'s':''}.`:''); OTP.code=''; }
  catch(e){ OTP.busy=false; OTP.err='Vérification impossible. Réessaie.'; }
  if($('#modal').innerHTML) renderOtp(); }

async function saveProfile(){ const v=id=>(($('#'+id)||{}).value||'').trim(); const nom=v('pfNom'), postal=v('pfPostal').toUpperCase();

let syncing=false;
async function syncGarage(show){ const pv=PV.get(); if(!pv||!pv.token||syncing) return; syncing=true;
  try{ const j=await Cloud.call({action:'garage', phone:pv.phone, verify_token:pv.token});
    PROFILE.set(j.profile||null);
    let added=0;
    for(const r of (j.cars||[])){ if(!r.state||!r.state.estimate) continue;
      const imgs={ slots:r.slots||{}, dmg:r.dmg||[] }; const photos=[...PHOTO_SLOTS.map(([k])=>imgs.slots[k]).filter(Boolean), ...imgs.dmg];
      const local=S.cars.find(c=>c.id===r.id);
      if(!local){ const car=Object.assign({}, r.state, { id:r.id, archived:!!r.archived, slots:imgs.slots, dmg:imgs.dmg, photos, docs:Object.assign({}, r.state.docs||{}, r.docs||{}), dbSaved:true, fromAccount:true });
        S.cars.push(car); await Store.save(car, true); added++; if(car.search&&car.search.leadToken&&['recherche','offre'].includes(car.status)) pollLead(car); }
      else if(local.fromAccount || !Object.keys(local.slots||{}).length){ // liens des photos rafraîchis
        local.slots=Object.assign({}, local.slots, imgs.slots); if(imgs.dmg.length) local.dmg=imgs.dmg; syncPhotos(local); await Store.save(local, true); } }
    if(show && added) toast(`${added} auto${added>1?'s':''} ajoutée${added>1?'s':''} à ton garage.`);
    if(['garage','home'].includes(S.screen)) rerender();
  }catch(e){ if(/non_connecte/.test(e.message)){ try{ localStorage.removeItem('sc_phone_ok'); }catch(_){} if(S.screen==='garage') rerender(); } }
  syncing=false; }

  Object.values(Cloud.t).forEach(clearTimeout); Cloud.t={};

/* ============ GLISSER POUR ARCHIVER (mobile) ============
   Glisser une auto du garage vers la gauche révèle « Archiver » (ou « Désarchiver »); archiver demande une confirmation. */
const SW={ el:null, x0:0, y0:0, dx:0, dir:null, open:null };
const SW_W=104;
const swHide = el => setTimeout(()=>{ if(!el.style.transform) el.parentElement?.classList.remove('on'); }, 240);
function swClose(){ if(SW.open){ const el=SW.open; el.style.transform=''; SW.open=null; swHide(el); } }
document.addEventListener('touchstart', e=>{ const card=e.target.closest('.swipe .gcar'); if(!card){ if(!e.target.closest('.swipe-act')) swClose(); return; }
  if(SW.open && SW.open!==card) swClose();
  const t=e.touches[0]; Object.assign(SW,{ el:card, x0:t.clientX, y0:t.clientY, dx:0, dir:null, base:SW.open===card?-SW_W:0 }); }, {passive:true});
document.addEventListener('touchmove', e=>{ if(!SW.el) return; const t=e.touches[0]; const dx=t.clientX-SW.x0, dy=t.clientY-SW.y0;
  if(!SW.dir){ if(Math.abs(dx)<8 && Math.abs(dy)<8) return; SW.dir=Math.abs(dx)>Math.abs(dy)?'h':'v'; if(SW.dir==='h'){ SW.el.classList.add('drag'); SW.el.parentElement.classList.add('on'); } }
  if(SW.dir!=='h') return; e.preventDefault();
  SW.dx=dx; const x=Math.max(-SW_W-30, Math.min(0, SW.base+dx)); SW.el.style.transform=`translateX(${x}px)`; }, {passive:false});
document.addEventListener('touchend', ()=>{ const el=SW.el; if(!el) return; el.classList.remove('drag');
  if(SW.dir==='h'){ const x=SW.base+SW.dx; if(x < -SW_W/2){ el.style.transform=`translateX(${-SW_W}px)`; SW.open=el; } else { el.style.transform=''; if(SW.open===el) SW.open=null; swHide(el); }
    el.dataset.swiped='1'; setTimeout(()=>{ delete el.dataset.swiped; }, 350); }
  SW.el=null; });
// un glissement ne doit pas ouvrir la fiche
document.addEventListener('click', e=>{ const c=e.target.closest('.swipe .gcar'); if(c && c.dataset.swiped){ e.stopPropagation(); e.preventDefault(); } }, true);

const TR={A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,J:1,K:2,L:3,M:4,N:5,P:7,R:9,S:2,T:3,U:4,V:5,W:6,X:7,Y:8,Z:9};
const WT=[8,7,6,5,4,3,2,10,0,9,8,7,6,5,4,3,2];
const YC='ABCDEFGHJKLMNPRSTVWXY123456789';
function normVin(v){ return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/O/g,'0').replace(/[IQ]/g, c=>c==='I'?'1':'0'); }
function vinCheck(v){ if(v.length!==17) return false; let s=0; for(let i=0;i<17;i++){ const c=v[i]; const n=/\d/.test(c)?+c:TR[c]; if(n===undefined) return false; s+=n*WT[i]; } const r=s%11; return v[8]===(r===10?'X':String(r)); }
function vinYear(v){ const i=YC.indexOf(v[9]); if(i<0) return null; let y=1980+i; if(/[A-Z]/.test(v[6])) y+=30; if(y>new Date().getFullYear()+1) y-=30; return y; }

 'KM8':'Hyundai','KMH':'Hyundai','5NM':'Hyundai','5NP':'Hyundai','KNA':'Kia','KND':'Kia','5XY':'Kia','1N4':'Nissan','3N1':'Nissan','5N1':'Nissan','JN1':'Nissan','JN8':'Nissan',

function visibleQs(step, a){ return STEPS[step].qs.filter(q=>!q.show || q.show(a)); }
function answered(q,a){ const v=a[q.id]; if(q.id==='roulable') return v==='Oui'; /* aucune offre si le véhicule ne roule pas */ if(!q.req) return true; if(q.type==='multi') return Array.isArray(v)&&v.length>0;
  if(q.id==='nom') return String(v||'').trim().split(/\s+/).filter(w=>w.length>1).length>=2;
  if(q.id==='cell') return String(v||'').replace(/\D/g,'').length>=10;
  if(q.id==='postal') return /^[A-Za-z]\d[A-Za-z]\s?\d[A-Za-z]\d$/.test(String(v||'').trim());
  if(q.type==='number') return Number(String(v||'').replace(/[^\d]/g,''))>0 || (q.id==='solde' && String(v)==='0');
  return v!==undefined && String(v).trim()!==''; }

    ${official?`<div class="best official">
      <span class="tag">✓ Meilleure offre Shopicar · Offre ferme</span>
      <h2>${(c.search||{}).intent==='initial'?(diff<0?'Ton offre a été ajustée après la validation':'Ton offre est validée!'):'Excellente nouvelle! Ta meilleure offre est prête'}</h2>
      ${(c.search||{}).intent==='initial'&&diff<0?`<div class="small" style="width:100%;background:#1f1f1f;border-radius:12px;padding:12px 14px;color:#e5e5e5"><b style="color:#fff">Pourquoi ce prix</b><br>${esc((bestOffer(c)||{}).note||'Un point de ton dossier diffère de tes déclarations. Parle à un conseiller pour le détail.')}<br><span style="color:#a3a3a3">Offre initiale : ${money(c.estimate)} · écart de ${money(-diff)}. Tu restes libre de refuser.</span></div>`:''}

      ${prepReady(c)?`<div class="small" style="color:#d4d4d4;text-align:center;width:100%">Ton rendez-vous est déjà réservé. Il est confirmé dès que tu acceptes.</div>`:''}

    <div class="offer">

      <div class="amt num">${amtHTML(shown)}</div>
      ${['offre','a_valider'].includes(c.status)?`<div class="cd"><span>Valide encore</span><b class="num" data-cd="${c.expiresAt}">${timeLeft(c.expiresAt-Date.now())}</b></div>`:''}
      ${nu&&diff>0?`<div class="small" style="color:#66a9f3">+${money(diff)} par rapport à ton offre initiale (${money(c.estimate)})</div>`:''}

      ${bonusLive(c)&&!expired?`<div class="bonus"><span>Accepte d'ici <b class="num" data-cd="${bonusEnd(c)}" style="font-size:14px;font-family:var(--f-body)">${timeLeft(bonusEnd(c)-Date.now())}</b></span><b>+${money(BONUS_24H)}</b></div>`:''}

    ${c.status==='planifiee'?pickupCardHTML(c):''}
    ${['acceptee','planifiee'].includes(c.status)?`<button class="btn ${c.status==='acceptee'?'pri':'sec'}" data-act="open-accept">${c.status==='acceptee'?'Compléter mes documents':(c.pickup||{}).lieu===PK_DROP?'Modifier mon dépôt':'Modifier ma cueillette'}</button>`:''}

function timeline(c){ const order=['offre','acceptee','planifiee','inspectee','payee']; const labels=[c.estimate?['Offre ferme reçue','Validée par Shopicar']:['Offre reçue','Calculée par l\'AI'],['Offre acceptée','Documents à téléverser'],['Cueillette planifiée','Chez toi ou chez un garage partenaire'],['Inspection de 10 min','Confirmation de l\'état'],['Payé','Virement le jour même']];
  let idx=order.indexOf(c.status==='a_valider'?'offre':c.status); if(idx<0) idx=0;
  return `<div class="tl">${labels.map((l,i)=>`<div class="s ${i<idx||(i===idx&&i===0)?'done':i===idx?'cur':''}"><div class="dot">${i<idx||(i===idx&&i===0)?'✓':i+1}</div><div><b>${l[0]}</b><div class="muted small">${l[1]}</div></div></div>`).join('')}</div>`; }

/* Documents et rendez-vous : partagés entre le dossier avant validation (parcours rapide) et l'écran après acceptation. */
function docsNeed(c){ const fin=c.answers.finance!=='Payée au complet';
  return [['immat','Certificat d\'immatriculation','Le document de la SAAQ'],['permis','Permis de conduire','Le recto suffit'], ...(fin?[['pret','État de compte du prêteur','Pour rembourser ton prêt']]:[])]; }
/* Avant validation, un document compte seulement si son fichier est encore sur l'appareil (il part avec le dossier). Après envoi ou en démo, le nom suffit. */
const docBlob = (c,k) => { const B=BLOBS[c.id]; return B&&!Array.isArray(B)&&B.docs&&B.docs[k]; };
const docHas = (c,k,strict) => !!(c.docs||{})[k] && (!strict || DEMO_OFFERS || !!c.prepSentAt || !!docBlob(c,k));
const docsOk = (c,strict) => docsNeed(c).every(n=>docHas(c,n[0],strict));
function docsHTML(c, strict){ const docs=c.docs||{};
  return docsNeed(c).map(n=>{ const ok=docHas(c,n[0],strict); return `<div class="doc ${ok?'ok':''}"><span class="doc-i">${ok?'✓':'📄'}</span><div style="flex:1;min-width:0"><b>${n[1]}</b><div class="small ${ok?'':'muted'}" style="${ok?'color:var(--ok)':''};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ok?'Reçu · '+esc(docs[n[0]]):n[2]}</div></div>
        <label class="btn ${ok?'sec':'blk'} doc-b" for="doc_${n[0]}">${ok?'Changer':'Ajouter'}</label>
        <input type="file" id="doc_${n[0]}" class="file-hidden" accept="image/*,application/pdf" data-doc="${n[0]}"></div>`; }).join(''); }
const todayIso = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
function pickupOk(c){ const pk=c.pickup||{}; const isDrop=pk.lieu===PK_DROP; const dr=isDrop?dropState(c):null;
  return !!(pk.date&&pk.slot&&pk.lieu&&(pk.lieu!=='À mon adresse'||(pk.adresse||'').trim().length>5)&&(!isDrop||(dr&&!dr.loading&&(pk.agent||!dr.agents.length)))); }
function pickupFormHTML(c){ const pk=c.pickup||{}; const isDrop=pk.lieu===PK_DROP; const dr=isDrop?dropState(c):null;
  const days=[]; for(let i=1;days.length<6;i++){ const d=new Date(Date.now()+i*86400000); if(d.getDay()===0) continue; days.push(d); }
  const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const dayLbl=d=>{ const w=d.toLocaleDateString('fr-CA',{weekday:'short'}).replace('.',''); return `<small>${w}</small><b>${d.getDate()}</b><small>${d.toLocaleDateString('fr-CA',{month:'short'}).replace('.','')}</small>`; };
  const sec=(t,body)=>`<div class="stp-q"><span class="ql">${t}</span>${body}</div>`;
  return `${sec('Où?',`<div class="chips">${[['À mon adresse','On vient chez moi'],[PK_DROP,'Je dépose mon auto chez un agent']].map(([o,l])=>`<button class="chip ${pk.lieu===o?'on':''}" data-act="pk" data-k="lieu" data-v="${esc(o)}">${l}</button>`).join('')}</div>
      ${pk.lieu==='À mon adresse'?`<input id="pkadr" class="inp" style="margin-top:10px" data-pk="adresse" value="${esc(pk.adresse||'')}" placeholder="Numéro, rue, ville">`:''}
      ${isDrop?dropPickerHTML(c,dr):''}`)}
      ${sec('Quel jour?',`<div class="days">${days.map(d=>`<button class="day ${pk.date===iso(d)?'on':''}" data-act="pk" data-k="date" data-v="${iso(d)}">${dayLbl(d)}</button>`).join('')}</div>`)}
      ${sec('À quelle heure?',`<div class="chips">${['8 h à 12 h','12 h à 16 h','16 h à 20 h'].map(o=>`<button class="chip ${pk.slot===o?'on':''}" data-act="pk" data-k="slot" data-v="${o}">${o}</button>`).join('')}</div>`)}`; }
function pickupLabel(c){ const pk=c.pickup||{}; const w=pickupWhen(c); if(!w) return ''; return `${w.label}, ${pk.slot} · ${pk.lieu===PK_DROP?'dépôt chez ':''}${pickupWhere(c)}`; }
function pickupApi(c){ const pk=c.pickup||{};
  return { when:`${new Date(pk.date+'T12:00:00').toLocaleDateString('fr-CA',{weekday:'long',day:'numeric',month:'long'})}, ${pk.slot}`,
    where: pk.lieu==='À mon adresse'?pk.adresse:pk.agent?`Dépôt chez ${pk.agent.nom}, ${pk.agent.adresse}, ${pk.agent.ville}`:'Dépôt chez un agent Shopicar (à confirmer)' }; }
/* Parcours rapide : le rendez-vous choisi avant la validation est encore à venir → l'acceptation le confirme directement. */
const prepReady = c => (c.search||{}).intent==='initial' && !!c.prepSentAt && pickupOk(c) && (c.pickup||{}).date > todayIso();
function validationListHTML(c){ const fin=c.answers.finance!=='Payée au complet'; return `<ul class="clean warnl small" style="margin:0">
    <li><span>Tes photos et tes dommages correspondent à tes déclarations.</span></li>
    <li><span>Tes documents sont conformes : immatriculation et permis au nom du vendeur${fin?', état de compte du prêteur':''}.</span></li>
    <li><span>Rapport Carfax conforme à tes déclarations (accidents, kilométrage, titre).</span></li>
    <li><span>Aucune charge ou dette non déclarée au RDPRM.</span></li>
    <li><span>Au rendez-vous : inspection rapide de 15 à 20 minutes, kilométrage au plus 500 km de plus que déclaré.</span></li></ul>`; }

/* ---- 2 bis. Parcours rapide : « Cette offre me convient » → 1. photos + dommages, 2. documents, 3. rendez-vous, 4. validation par un conseiller ---- */
function vPrep(){ const c=S.current; if(!c) return vGarage();
  const p1=photosDone(c), p2=docsOk(c,true), p3=pickupOk(c); const done=[p1,p2,p3].filter(Boolean).length; const isDrop=(c.pickup||{}).lieu===PK_DROP;
  const head=(n,ok,t,sub,lock)=>`<div class="stp-h"><span class="stp-n ${ok?'ok':''}" style="${lock&&!ok?'background:#d4d4d4':''}">${ok?'✓':n}</span><div style="flex:1"><h2>${t}</h2><p class="small muted" style="margin:2px 0 0">${sub}</p></div><span class="stp-s ${ok?'ok':''}">${ok?'Complété':lock?'À venir':'À faire'}</span></div>`;

      ${p1&&p2?pickupFormHTML(c):wait('Ajoute d\'abord tes documents.')}</div>
    <div class="card stp">${head(4,false,'Validation du dossier','On vérifie que tes photos et tes documents sont conformes, puis on te confirme ton offre ferme.').replace(/<span class="stp-s[^>]*>[^<]*<\/span>/,'')}
      ${validationListHTML(c)}</div>
    <button class="btn pri big" data-act="prep-send" ${done===3?'':'disabled'}>Envoyer le dossier</button>
    ${done<3?`<p class="muted small" style="text-align:center;margin:-4px 0 0">Il te reste : ${[!p1&&'tes photos et tes dommages',!p2&&'tes documents',!p3&&'ton rendez-vous'].filter(Boolean).join(', ')}.</p>`:''}

    <button class="btn ghost" data-act="prep-back">Revenir à mon offre initiale</button>
  </div>`; }

function vAccept(){ const c=S.current; const pk=c.pickup||{}; const fin=c.answers.finance!=='Payée au complet';
  const dOk=docsOk(c); const isDrop=pk.lieu===PK_DROP; const pkOk=pickupOk(c);
  const done=[dOk,pkOk].filter(Boolean).length;
  const head=(n,ok,t,sub)=>`<div class="stp-h"><span class="stp-n ${ok?'ok':''}">${ok?'✓':n}</span><div style="flex:1"><h2>${t}</h2><p class="small muted" style="margin:2px 0 0">${sub}</p></div><span class="stp-s ${ok?'ok':''}">${ok?'Complété':'À faire'}</span></div>`;
  return `${topbar('Prochaines étapes','open-offer')}
  <div class="wrap">
    <div class="offer"><span class="lbl">Offre acceptée</span><div class="amt num">${Math.round(c.finalOffer||c.offer).toLocaleString('fr-CA')}<sup>$</sup></div>
      ${fin?`<div class="small" style="color:#d4d4d4">On rembourse ${esc(c.answers.preteur||'ton prêteur')} (environ ${money(Number(String(c.answers.solde).replace(/\D/g,''))||0)}). Tu reçois la différence.</div>`:''}</div>
    <div><h2 style="font-size:22px">Plus que 2 étapes pour être payé</h2>
      <div class="stp-prog"><i style="width:${done*50}%"></i></div><p class="small muted" style="margin:6px 0 0">${done}/2 complétées · ça prend environ 2 minutes</p></div>

    <div class="card stp ${dOk?'ok':''}">${head(1,dOk,'Tes documents','Prends une photo claire de chaque document.')}
      ${docsHTML(c)}
    </div>

    <div class="card stp ${pkOk?'ok':''}">${isDrop?head(2,pkOk,'Ton dépôt','Choisis l\'agent Shopicar le plus près de chez toi.'):head(2,pkOk,'Ta cueillette','On vient chercher ton auto, sans frais.')}
      ${pickupFormHTML(c)}
    </div>

    <div class="card stp">${head(3,c.status==='payee','Ton paiement','Tu es payé le jour même.').replace(/<span class="stp-s[^>]*>[^<]*<\/span>/,'')}
      <div class="pay"><div><b>1</b><span>On arrive à l'heure choisie</span></div><div><b>2</b><span>Inspection rapide de 15 à 20 minutes</span></div><div><b>3</b><span>Virement de ${money(c.finalOffer||c.offer)}${fin?' (moins le solde du prêt)':''} le jour même</span></div></div>
    </div>

/* ---- Cueillette / dépôt : agents les plus proches, détails du RDV, ajout à l'agenda ---- */
const PK_DROP = 'Garage partenaire près de chez moi'; // valeur enregistrée (anciens dossiers) = dépôt chez un agent Shopicar
const dropPostal = c => ((c.pickup||{}).postal || c.answers.postal || '').toUpperCase();
function dropState(c){ const postal=dropPostal(c);
  if(!S.drop || S.drop.postal!==postal){ S.drop={postal, loading:true, agents:[], source:''};
    fetch('/api/dropoff?postal='+encodeURIComponent(postal)+(DEMO_OFFERS?'&demo=1':'')).then(r=>r.json()).catch(()=>({agents:[]})).then(j=>{
      if(!S.drop || S.drop.postal!==postal) return;
      Object.assign(S.drop,{loading:false, agents:j.agents||[], source:j.source||'', error:j.error||''});
      const pk=c.pickup=c.pickup||{}; if(!pk.agent || !S.drop.agents.some(a=>a.id===pk.agent.id)) pk.agent=S.drop.agents[0]||null;
      if(S.screen==='accept'||S.screen==='prep') rerender(); }); }
  return S.drop; }
const mapsUrl = q => 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const agentAddr = a => a.demo ? `${a.ville} (${a.postal})` : `${a.adresse}, ${a.ville} ${a.postal||''}`.trim();
function dropPickerHTML(c, dr){ const pk=c.pickup||{}; const postal=dropPostal(c);
  const postalForm = `<div class="row" style="margin-top:10px"><input id="dropPostal" class="inp" value="${esc(postal)}" placeholder="Ton code postal" maxlength="7" style="flex:2"><button class="btn sec" data-act="drop-postal" style="flex:1">Chercher</button></div>`;
  if(!postal) return postalForm;
  if(dr.loading) return `<p class="muted small" style="margin:10px 0 0">Recherche des agents près de ${esc(postal)}…</p>`;
  if(dr.error==='code_postal') return `<p class="small" style="margin:10px 0 0;color:var(--bad)">Code postal introuvable. Vérifie-le.</p>${postalForm}`;
  if(!dr.agents.length) return `<p class="muted small" style="margin:10px 0 0">Un conseiller Shopicar te confirme l'agent le plus près de ${esc(postal)}, avec son adresse, avant ton rendez-vous.</p>`;
  return `<p class="muted small" style="margin:12px 0 6px">Les plus près de <b>${esc(postal)}</b> · <a href="#" onclick="event.preventDefault();document.getElementById('dropBox').style.display='block'">changer</a></p>
    <div id="dropBox" style="display:none">${postalForm}</div>
    <div style="display:flex;flex-direction:column;gap:8px">${dr.agents.map((a,i)=>{ const on=pk.agent&&pk.agent.id===a.id;
      return `<button class="chip ${on?'on':''}" data-act="pk-agent" data-v="${esc(a.id)}" style="border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;width:100%">
        <span style="font-size:18px;line-height:1.2">${on?'✓':'📍'}</span><span style="flex:1;min-width:0"><b>${esc(a.nom)}</b>${i===0?` <small style="opacity:.75">· le plus près</small>`:''}<br>
        <small style="opacity:.8">${esc(agentAddr(a))} · ${a.km<1?'moins de 1':a.km} km</small>${a.heures?`<br><small style="opacity:.7">${esc(a.heures)}</small>`:''}</span></button>`; }).join('')}</div>
    ${pk.agent?`<a class="btn ghost" style="padding:8px 0 0" target="_blank" rel="noopener" href="${mapsUrl(pk.agent.demo?pk.agent.ville+' '+pk.agent.postal:agentAddr(pk.agent))}">Voir l'itinéraire</a>`:''}`; }
function pickupWhen(c){ const pk=c.pickup||{}; if(!pk.date) return null;
  const m=String(pk.slot||'').match(/(\d{1,2})\s*h\s*à\s*(\d{1,2})/); const h1=m?+m[1]:9, h2=m?+m[2]:h1+1;
  const d=pk.date.replace(/-/g,''); const t=h=>String(h).padStart(2,'0')+'0000';

function loadImg(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const im=new Image(); im.onload=()=>res({im,u}); im.onerror=rej; im.src=u; }); }
function draw(im,max){ const r=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*r); c.height=Math.round(im.height*r); c.getContext('2d').drawImage(im,0,0,c.width,c.height); return c; }
const toBlob=(c,q)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));

$('#slotFile').addEventListener('change', async e=>{ const c=S.current; const key=S.slotTarget; const files=[...e.target.files]; e.target.value=''; if(!files.length||!c||!key) return;

  const B=BLOBS[c.id]; const added=[]; let bad=0;
  for(const f of (key==='dmg'?files:files.slice(0,1))){
    if(key==='dmg' && (c.dmg||[]).length>=DMG_MAX){ toast(`${DMG_MAX} photos de dommages au maximum.`); break; }
    try{ const {im,u}=await loadImg(f); const thumb=draw(im,320).toDataURL('image/jpeg',.6); const blob=await toBlob(draw(im,1024),.8); URL.revokeObjectURL(u);
      if(key==='dmg'){ c.dmg=c.dmg||[]; c.dmg.push(thumb); B.dmg.push(blob); added.push(c.dmg.length-1); }
      else { c.slots=c.slots||{}; c.slots[key]=thumb; B.slots[key]=blob; added.push(key); }

/* ============ SCAN NIV ============ */
let zxingP=null;
function loadZXing(){ if(zxingP) return zxingP; zxingP=new Promise(res=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'; s.onload=()=>res(window.ZXing||null); s.onerror=()=>res(null); document.head.appendChild(s); }); return zxingP; }
$('#scanFile').addEventListener('change', async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return;
  S.busy='scan'; S.error=null; rerender(); let vin=null;
  try{ const {im,u}=await loadImg(f);
    const Z=await loadZXing();
    if(Z){ try{ const hints=new Map(); hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.DATA_MATRIX,Z.BarcodeFormat.QR_CODE]); hints.set(Z.DecodeHintType.TRY_HARDER,true);
      const r=new Z.BrowserMultiFormatReader(hints); const c=draw(im,1600); const res=await r.decodeFromImageUrl(c.toDataURL('image/jpeg',.92)); const m=normVin(res.getText()).match(/[A-HJ-NPR-Z0-9]{17}/); if(m) vin=m[0]; }catch(err){} }
    if(!vin){ const s=await getSample(); if(s){ const lim=await (s.limits?s.limits():{}); if(lim && lim.images!==false){ const blob=await toBlob(draw(im,1400),.85);
      const t=await s("Lis le numéro d'identification du véhicule (NIV/VIN, 17 caractères, sans I, O ni Q) visible sur cette photo (étiquette de porte, pare-brise, code-barres ou document). Réponds UNIQUEMENT en JSON: {\"vin\":\"...\"} ou {\"vin\":null} si illisible.", {images:[blob], modelTier:'default'});
      const j=parseJSON(t.text); if(j.vin) vin=normVin(j.vin).slice(0,17); } } }
    URL.revokeObjectURL(u);
  }catch(err){}
  S.busy=false;
  // NIV lu et valide : on décode tout de suite et on passe à l'écran du véhicule (pas besoin de « Continuer »)
  if(vin && vin.length===17 && vinCheck(vin)){ S.draft.vin=vin; rerender(); toast('NIV lu : '+vin); decodeVin(); return; }
  if(vin && vin.length===17){ S.draft.vin=vin; toast('NIV lu, vérifie-le : '+vin); }
  else S.error="On n'a pas pu lire le NIV sur la photo. Rapproche-toi de l'étiquette, évite les reflets, ou tape-le.";
  rerender(); });

/* ============ DÉCODAGE ============ */
async function decodeVin(){ const d=S.draft; const v=d.vin; if(v.length!==17) return; if(S.busy) return;
  const loc=localDecode(v); const cs=vinCheck(v); S.busy='decode'; S.error=null; rerender();
  let veh=null;
  // 1) Base officielle NHTSA : la vraie marque, le vrai modèle, la vraie version. Aucune devinette.
  try{ const r=await fetch('/api/vin?vin='+encodeURIComponent(v)); const j=await r.json(); if(r.ok && j.found && j.vehicle) veh=j.vehicle; }catch(err){ console.warn('[vin]',err); }
  // 2) Repli AI seulement si la NHTSA ne connaît pas le NIV; la marque du WMI a priorité sur l'AI.
  if(!veh) try{
    const t=await ask(`Décode ce NIV (VIN) nord-américain : ${v}
Indices déjà calculés : fabricant probable selon le WMI = ${loc.make||'inconnu'}, année modèle selon le 10e caractère = ${loc.year||'inconnue'}, chiffre de contrôle ${cs?'valide':'INVALIDE'}.
Utilise ta connaissance des structures de NIV (WMI, VDS positions 4 à 8, usine) pour identifier le véhicule le plus précisément possible, tel que vendu au Canada.
Réponds UNIQUEMENT en JSON, en français pour les champs descriptifs :
{"year":nombre,"make":"","model":"","trim":"version probable ou vide","body":"VUS, berline, camionnette, etc.","engine":"ex. 2.0 L 4 cyl. turbo","drivetrain":"Traction intégrale / Traction avant / Propulsion / 4x4","transmission":"Automatique ou Manuelle","confiance":"haute|moyenne|faible","notes":"une phrase si la version est incertaine, sinon vide"}`, {modelTier:'default'});
    veh=parseJSON(t);
    if(loc.make && veh.make && veh.make.toLowerCase()!==loc.make.toLowerCase()){ veh={ year:loc.year, make:loc.make, model:'', trim:'', confiance:'faible', notes:"Modèle non confirmé : entre le modèle et la version ci-dessous." }; }
    else { veh.confiance='faible'; veh.notes=(veh.notes?veh.notes+' ':'')+"Modèle estimé, à confirmer."; }
  }catch(err){
    if(!loc.make && !loc.year){ S.busy=false; S.error = err.code==='not_granted' ? "Le décodage AI n'est pas disponible ici. Ouvre l'app dans Claude, ou entre ton véhicule à l'étape suivante." : "Décodage impossible pour l'instant. Réessaie dans un instant."; }
    veh={ year:loc.year, make:loc.make, model:'', trim:'', confiance:'faible', notes:"Décodage partiel : complète le modèle et la version." };
  }
  if(!cs && veh) veh.notes = (veh.notes?veh.notes+' ':'') + "Le chiffre de contrôle du NIV ne concorde pas : vérifie qu'il n'y a pas d'erreur de frappe.";
  S.busy=false; d.vehicle=veh; go('confirm'); }

/* ============ ÉVALUATION AI ============ */
function answersText(a){ const L=[]; const add=(k,v)=>{ if(v!==undefined&&v!==''&&!(Array.isArray(v)&&!v.length)) L.push(`- ${k} : ${Array.isArray(v)?v.join(', '):v}`); };

async function ensureLead(c){ if(c.search&&c.search.leadToken) return c.search.leadToken; if(DEMO_OFFERS&&c.inspekFull) return null;

async function startSearch(c, intent){ if(starting) return;

function feedPoll(c){ const s=c.search; const now=Date.now(); const added=[]; let changed=false;

    if(s.intent==='initial'){ if(el>=8 && !s.offers.some(o=>o.id==='demo-init')){ const at=s.startedAt+8000; const o={id:'demo-init', amount:c.estimate, at, expiresAt:at+OFFER_HOURS*3600000, status:'valid'}; s.offers.push(o); added.push(o); }

function openRdv(t){ RD.type=t; RD.date=''; RD.slot=''; renderRdv(); }
function renderRdv(){ const tmr=new Date(Date.now()+86400000).toISOString().slice(0,10); const slots=RD.type==='appel'?['9 h','11 h','13 h','15 h','17 h','19 h']:['9 h 30','11 h','13 h 30','15 h','16 h 30','18 h'];
  $('#modal').innerHTML=`<div class="sheet-bg" data-act="close"><div class="sheet"><div class="hd"><h2>${RD.type==='appel'?(S.current&&S.current.estimate?'Parler à un conseiller Shopicar':'Planifier un appel'):'Prendre un rendez-vous'}</h2><button class="x" data-act="close" aria-label="Fermer">×</button></div>
  <div class="bd"><p class="muted" style="margin:0">${RD.type==='appel'?(S.current&&S.current.estimate?`Choisis le moment qui te convient : un conseiller Shopicar te rappelle${S.current.answers.cell?' au '+esc(S.current.answers.cell):''} pour répondre à tes questions.`:'Un acheteur Shopicar te rappelle pour répondre à tes questions sur l\'offre.'):'Viens montrer ton auto à notre centre ou à un garage partenaire. L\'inspection prend 10 minutes.'}</p>
  <div class="field"><label for="rdd">Date</label><input id="rdd" type="date" class="inp" min="${tmr}" value="${RD.date}"></div>
  <div class="q"><span class="ql">Heure</span><div class="chips">${slots.map(s=>`<button class="chip ${RD.slot===s?'on':''}" data-act="rdv-slot" data-v="${s}">${s}</button>`).join('')}</div></div>
  <button class="btn pri" data-act="rdv-save" ${RD.date&&RD.slot?'':'disabled'}>Confirmer</button></div></div></div>`;
  $('#rdd').addEventListener('input',e=>{ RD.date=e.target.value; renderRdv(); }); }
async function saveRdv(){ const c=S.current; const dt=new Date(RD.date+'T12:00:00'); const label=dt.toLocaleDateString('fr-CA',{weekday:'long',day:'numeric',month:'long'})+' à '+RD.slot;
  if(c.estimate && !DEMO_OFFERS){ const b=$('[data-act="rdv-save"]'); if(b){ b.disabled=true; b.innerHTML='<span class="spin"></span> Envoi…'; }
    try{ const tok=await ensureLead(c); await leadApi({action:RD.type==='appel'?'callback':'rdv', token:tok, when:label}); }
    catch(e){ toast('Envoi impossible pour l\'instant. Réessaie.'); renderRdv(); return; } }
  else if(c.search&&c.search.leadToken){ try{ await leadApi({action:RD.type==='appel'?'callback':'pickup', token:c.search.leadToken, when:label}); }catch(e){ toast('Envoi impossible pour l\'instant. Réessaie.'); return; } }
  c.rdv={type:RD.type, date:RD.date, slot:RD.slot, label};
  await Store.save(c); $('#modal').innerHTML=''; toast(RD.type==='appel'?'Rappel demandé. Un conseiller te rappelle à l\'heure choisie.':(c.estimate?'Demande de rendez-vous envoyée. Un conseiller te confirme le rendez-vous.':'Rendez-vous confirmé.')); rerender(); }

/* « Je veux plus » : avertissement avant de quitter l'offre initiale */
function openMoreModal(){ const c=S.current;
  $('#modal').innerHTML=`<div class="sheet-bg" data-act="close"><div class="sheet"><div class="hd"><h2>Avant de continuer</h2><button class="x" data-act="close" aria-label="Fermer">×</button></div>
  <div class="bd">
    <div class="jrow"><div class="julia-av">J</div><div class="bubble">Je vais essayer d'obtenir le meilleur prix possible, le plus proche de ce que tu veux.</div></div>
    <ul class="clean warnl">
      <li><span>Les offres reçues peuvent être <b>plus hautes ou plus basses</b> que ton offre initiale.</span></li>
      <li><span>Ton offre initiale de <b class="num">${money(c.estimate)}</b> <b>ne sera plus garantie</b>.</span></li>
      <li><span>Tu devras ajouter 6 photos et tes dommages pour que Julia travaille pour toi.</span></li>
    </ul>
    <button class="btn pri big" data-act="more-keep">Ok, je garde mon offre initiale de ${money(c.estimate)}</button>
    <button class="btn sec" data-act="more-go">Je veux quand même que Julia cherche un meilleur prix</button>
  </div></div></div>`; }

/* ============ JULIA ============ */
function juliaContext(){ const c=S.current; if(!c) return 'Le client n\'a pas encore d\'offre.'; return juliaContext0(c) + (isTrade(c.answers)?` Le client veut ÉCHANGER son auto (trade-in) et recherche : ${c.answers.recherche||'modèle non précisé'}. Un conseiller lui proposera des autos qui correspondent.`:'') + (c.wish?` Le client aimerait obtenir ${money(c.wish)}${(c.wishWhy||'').trim()?` (raisons données : ${c.wishWhy.trim()})`:''}; rappelle-lui que les offres reçues peuvent être plus hautes ou plus basses que l'offre initiale, et qu'avec ses photos et dommages, Julia cherche le meilleur prix.`:'') + (c.fastTrack&&!c.fastTrack.ok&&c.status==='estimation'?' Ce véhicule est dans une catégorie plus difficile à évaluer : il faut ses photos et ses dommages pour une offre ferme; ne propose pas d\'accepter l\'offre initiale telle quelle.':''); }
function juliaContext0(c){
  if(c.estimate && ['estimation','recherche'].includes(c.status)){ const b=bestOffer(c);
    return `Dossier du client : ${vTitle(c.vehicle)} ${c.vehicle.trim||''}, ${c.answers.km} km, NIV ${c.vin}, ${(c.photos||[]).length} photo(s). Offre initiale Shopicar : ${money(c.estimate)} (offre initiale conditionnelle suite à la réception des photos et dommages; pas une offre garantie, le prix final peut être plus haut ou plus bas). ${c.status==='recherche'?(b?`Shopicar cherche le meilleur prix; meilleure offre validée jusqu'ici : ${money(b.amount)}.`:'Shopicar cherche le meilleur prix; aucune offre validée pour l\'instant.'):'Le client n\'a pas encore lancé la recherche du meilleur prix (bouton « Obtenir mon meilleur prix Shopicar »). Encourage-le à ajouter des photos (avant, arrière, côtés, tableau de bord, dommages) s\'il n\'en a pas.'} Ne donne jamais d'autre montant que ceux-ci.`; }
  if(c.estimate) return `Dossier du client : ${vTitle(c.vehicle)} ${c.vehicle.trim||''}, ${c.answers.km} km, NIV ${c.vin}. Offre initiale : ${money(c.estimate)}. Meilleure offre Shopicar (offre ferme) : ${money(c.finalOffer||c.offer)} (statut : ${statusInfo(c).txt}), valide jusqu'au ${new Date(c.expiresAt).toLocaleString('fr-CA')}.${bonusLive(c)?` Bonus de ${money(BONUS_24H)} si le client accepte avant le ${new Date(bonusEnd(c)).toLocaleString('fr-CA')} (24 h après l'offre officielle).`:''} Pour accepter : bouton « Accepter mon offre et prendre rendez-vous »; pour un humain : « Parler à un conseiller Shopicar ».`;
  return `Dossier du client : ${vTitle(c.vehicle)} ${c.vehicle.trim||''}, ${c.answers.km} km, NIV ${c.vin}. Offre Shopicar : ${money(c.finalOffer||c.offer)} (statut : ${statusInfo(c).txt}), valide jusqu'au ${new Date(c.expiresAt).toLocaleString('fr-CA')}. Calcul : wholesale ${money(c.valuation.wholesale_final)} moins frais Shopicar ${money(c.fee||FEE)}. Bonus de ${money(BONUS_24H)} si acceptée dans les 24 h suivant l'offre.`; }
function openJulia(prefill){ if(!S.chat.length) S.chat.push({role:'assistant',content:`Salut${S.current&&S.current.answers.prenom?' '+S.current.answers.prenom:''} ! Moi c'est Julia de Shopicar. Je peux t'aider avec ton offre, tes documents ou ta cueillette. Qu'est-ce que je peux faire pour toi ?`});
  renderJulia(); if(prefill){ $('#jin').value=prefill; sendJulia(); } }
function renderJulia(typing){ $('#modal').innerHTML=`<div class="sheet-bg" data-act="close"><div class="sheet" style="height:86%">
  <div class="hd"><div style="display:flex;gap:10px;align-items:center"><div class="julia-av">J</div><div><b>Julia</b><div class="muted small">Shopicar · répond par texto</div></div></div><button class="x" data-act="close" aria-label="Fermer">×</button></div>
  <div class="bd" id="jbd"><div class="chat">${S.chat.map(m=>`<div class="msg ${m.role==='user'?'u':'j'}">${esc(m.content)}</div>`).join('')}${typing?'<div class="msg j"><span class="spin" style="display:inline-block;width:16px;height:16px;border-width:2px"></span></div>':''}</div></div>
  <div class="chatbar"><input id="jin" class="inp" placeholder="Écris à Julia…" autocomplete="off"><button class="btn pri" data-act="julia-send">Envoyer</button></div></div></div>`;
  const b=$('#jbd'); b.scrollTop=b.scrollHeight; }
let jBusy=false;
async function sendJulia(){ const inp=$('#jin'); const t=(inp&&inp.value||'').trim(); if(!t||jBusy) return; S.chat.push({role:'user',content:t}); jBusy=true; renderJulia(true);
  const sys=`Tu es Julia, conseillère de Shopicar, entreprise québécoise qui achète les véhicules des particuliers. Tu écris comme par texto : 1 à 3 phrases, chaleureuse, français québécois neutre, tutoiement, pas d'emoji en excès.
Règles : ${!(S.current&&!S.current.estimate)?'l\'offre est basée sur les données du marché (véhicules semblables à vendre au Québec) et les caractéristiques du véhicule; ne parle jamais de marge, de valeur wholesale, de frais internes ni du modèle d\'affaires de Shopicar; ensuite Shopicar cherche le meilleur prix et seules les offres validées par Shopicar comptent. Ce n\'est pas une enchère et tu ne nommes jamais d\'acheteur ou de concessionnaire;':'l\'offre est ferme et sans négociation, basée sur la valeur wholesale moins le frais Shopicar ('+money(FEE_MIN)+' à '+money(FEE_MAX)+' selon la valeur, montant exact dans le dossier);'} ne change jamais un montant et ne promets rien hors des conditions (Carfax conforme, état confirmé par inspection de 10 min, aucune dette non déclarée au RDPRM). Si le client veut discuter du prix ou parler à quelqu'un, propose un conseiller (bouton « ${S.current&&S.current.estimate?'Parler à un conseiller Shopicar':'Planifier un appel'} »). Sans NIV : il est au bas du pare-brise côté conducteur, sur le montant de la porte conducteur, sur le certificat d'immatriculation SAAQ ou la carte d'assurance; on peut aussi prendre une photo dans l'app. Paiement par virement le jour de la cueillette; on rembourse le prêteur directement.
${juliaContext()}`;
  const msgs=S.chat.slice(-12).map(m=>({role:m.role,content:m.content})); while(msgs.length&&msgs[0].role!=='user') msgs.shift();
  if(msgs.length) msgs[0]={role:'user',content:`[Contexte pour Julia, ne pas citer]\n${sys}\n\n[Message du client]\n${msgs[0].content}`};
  try{ const r=await ask(msgs,{modelTier:'quick', cache:false}); S.chat.push({role:'assistant',content:r.trim()}); }
  catch(e){ S.chat.push({role:'assistant',content: e.code==='not_granted'?"Je ne suis pas disponible dans cette vue. Ouvre l'app dans Claude pour me parler.":"Petit pépin de mon côté, réessaie dans un instant."}); }
  jBusy=false; renderJulia(); }

/* ============ GARAGE ============ */
async function loadGarage(){ const list=await Store.list(); S.cars=list; S.loaded=true; setTimeout(()=>syncGarage(false).then(inspekBackfill),0); list.forEach(c=>{ if(c.estimate&&!c.dbSaved) Cloud.save(c); }); if(S.screen==='garage'||S.screen==='home') rerender(); }

/* comptes à rebours */
setInterval(()=>{ document.querySelectorAll('[data-cd]').forEach(el=>{ el.textContent=timeLeft(+el.dataset.cd-Date.now()); }); }, 30000);

/* Lien du texto (?o=<jeton>) : ouvre le dossier, même sur un autre appareil (reconstruit depuis 360inspek) */
async function openFromLink(){ const tok=new URLSearchParams(location.search).get('o'); if(!tok||!/^[0-9a-f]{36}$/.test(tok)) return;
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
  await loadGarage(); let c=S.cars.find(x=>x.search&&x.search.leadToken===tok);
  if(!c){ try{ const j=await leadApi({action:'status', token:tok}); const p=j.payload||{};
      c={ id:'lead-'+tok.slice(0,10), vin:p.vin||'', vehicle:Object.assign({}, p.vehicle||{}, j.vehicle||{}), answers:Object.assign({}, p.answers||{}), photos:[], valuation:{}, estimate:j.estimate, offer:j.estimate, fee:p.fee||null,
        status:'recherche', createdAt:Date.parse(j.created_at)||Date.now(), expiresAt:Date.now()+OFFER_HOURS*3600000, search:{ status:'running', startedAt:Date.parse(j.created_at)||Date.now(), demo:false, notify:false, offers:[], leadToken:tok } };
      S.cars.push(c); await Store.save(c);
    }catch(e){ toast('Ce lien n\'est plus valide.'); return; } }
  S.current=c; await pollLead(c); go(screenFor(c)); }
render(); loadGarage(); initAdmin(); openFromLink();
</script>
</body>
